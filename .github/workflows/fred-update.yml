name: fred-data daily update

# PC・Claude・Windows更新から独立して、毎日 fred-data.json を更新する。
# 2026-09-10〜11 の欠測（Windows KB5124008 による Cowork サンドボックス障害）を受けて新設。

on:
  schedule:
    # UTC 22:37 = JST 07:37（実際はGitHubの混雑で JST 09:35〜09:55 頃に実行されている）
    - cron: "37 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fred-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: FRED / Yahoo からデータ取得して fred-data.json を生成
        id: fetch
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          OUT_PATH: fred-data.json
        run: python scripts/fetch_fred.py

      # 【重要・2026-09-17追加 / 09-19拡張】読み取り側のキャッシュ事故対策。
      # ① data/YYYY-MM-DD.json … その日初めて存在するURL。古いキャッシュが原理上存在しない
      # ② data/latest.json … 固定名。web_fetchのプロヴェナンス制限（完全なURLが
      #    プロンプトに書いてある必要がある）を回避するため、日付なしのURLも用意する
      - name: スナップショットを保存（日付入り＋latest）
        run: |
          mkdir -p data
          cp fred-data.json "data/$(date -u +%Y-%m-%d).json"
          cp fred-data.json data/latest.json
          echo "snapshot: data/$(date -u +%Y-%m-%d).json / data/latest.json"

      # index.html の CACHE_KEY を上げて、閲覧者の localStorage キャッシュ（4時間TTL）を破棄する。
      - name: CACHE_KEY をインクリメント
        run: |
          cur=$(grep -o "koya_v[0-9]\+" index.html | head -1)
          if [ -z "$cur" ]; then
            echo "CACHE_KEY not found; skip"
            exit 0
          fi
          num=${cur#koya_v}
          next=$((num + 1))
          sed -i "s/koya_v${num}/koya_v${next}/g" index.html
          echo "CACHE_KEY: ${cur} -> koya_v${next}"

      - name: 変更があればコミット
        run: |
          git add fred-data.json index.html data
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git config user.name  "koya-bot"
          git config user.email "okinawadao369@gmail.com"
          git commit -m "${{ steps.fetch.outputs.summary }}"
          git push

      - name: サマリを表示
        if: always()
        run: |
          {
            echo "### fred-data.json 更新結果"
            echo ""
            echo "- 取得成功系列: ${{ steps.fetch.outputs.ok_count }} / 13"
            echo "- koya経営スコア: ${{ steps.fetch.outputs.koya_score }} / 100"
            echo "- スナップショット: data/$(date -u +%Y-%m-%d).json 及び data/latest.json"
          } >> "$GITHUB_STEP_SUMMARY"
