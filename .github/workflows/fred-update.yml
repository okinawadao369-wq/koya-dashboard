name: fred-data daily update

# PC・Claude・Windows更新から独立して、毎日 fred-data.json を更新する。
# 2026-09-10〜11 の欠測（Windows KB5124008 による Cowork サンドボックス障害）を受けて新設。

on:
  schedule:
    # UTC 22:37 = JST 07:37
    # 当初 UTC 00:05（JST 09:05）にしたが、毎時00分・特に 00:00 UTC は
    # 世界中のジョブが集中し、2026-09-12の実測で4時間21分遅延した。
    # 混雑帯を避けた端数分に変更し、JST 09:06 のレポート生成に確実に間に合わせる。
    - cron: "37 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fred-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python を準備
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: FRED / Yahoo からデータ取得して fred-data.json を生成
        id: fetch
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          OUT_PATH: fred-data.json
        run: python scripts/fetch_fred.py

      # index.html の CACHE_KEY を上げて、閲覧者の localStorage キャッシュ（4時間TTL）を破棄する。
      # これがないと、JSONは新しいのに画面の数字だけ古いという食い違いが起きる。
      - name: CACHE_KEY をインクリメント
        run: |
          cur=$(grep -o "koya_v[0-9]\+" index.html | head -1)
          if [ -z "$cur" ]; then
            echo "CACHE_KEY not found; skip"
            exit 0
          fi
          num=${cur#koya_v}
          next=$((num + 1))
          sed -i "s/koya_v${num}/koya_v${next}/g" index.html
          echo "CACHE_KEY: ${cur} -> koya_v${next}"

      - name: 変更があればコミット
        run: |
          if git diff --quiet -- fred-data.json index.html; then
            echo "no change"
            exit 0
          fi
          git config user.name  "koya-bot"
          git config user.email "okinawadao369@gmail.com"
          git add fred-data.json index.html
          git commit -m "${{ steps.fetch.outputs.summary }}"
          git push

      - name: サマリを表示
        if: always()
        run: |
          {
            echo "### fred-data.json 更新結果"
            echo ""
            echo "- 取得成功系列: ${{ steps.fetch.outputs.ok_count }} / 13"
            echo "- koya経営スコア: ${{ steps.fetch.outputs.koya_score }} / 100"
          } >> "$GITHUB_STEP_SUMMARY"
